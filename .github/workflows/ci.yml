name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Poppler.Net.sln --configfile NuGet.Config

      - name: Build
        run: dotnet build Poppler.Net.sln --configuration Release --no-restore

      - name: Verify managed-only dependencies
        run: >-
          dotnet run
          --project eng/Poppler.Net.ManagedOnlyVerifier/Poppler.Net.ManagedOnlyVerifier.csproj
          --configuration Release
          --no-build
          --
          "${{ github.workspace }}"

      - name: Test
        run: >-
          dotnet run
          --project tests/Poppler.Net.Tests/Poppler.Net.Tests.csproj
          --configuration Release
          --no-build
          --
          --noresult

  package:
    name: Pack NuGet package
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Poppler.Net.sln --configfile NuGet.Config

      - name: Build
        run: dotnet build Poppler.Net.sln --configuration Release --no-restore

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(dotnet msbuild src/Poppler.Net/Poppler.Net.csproj -nologo -getProperty:Version)"
          if [[ "${RELEASE_TAG#v}" != "$package_version" ]]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match package version '$package_version'."
            exit 1
          fi

      - name: Pack
        run: >-
          dotnet pack
          src/Poppler.Net/Poppler.Net.csproj
          --configuration Release
          --no-build
          --output artifacts

      - name: Upload NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to NuGet.org
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nuget.org
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.423

      - name: Download NuGet package
        uses: actions/download-artifact@v8
        with:
          name: nuget-package
          path: artifacts

      - name: Log in to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
