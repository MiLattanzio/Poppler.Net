name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  managed-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.423
          cache: true
          cache-dependency-path: Directory.Packages.props
      - name: Build and test
        shell: pwsh
        run: ./build.ps1 Release
